name: "Publish scripts"

on:
  push:
    branches:
      - master
    paths:
      - scripts/**

jobs:
  publish:
    # Fork: the Cloudflare Pages project (hy2scripts) and its secrets belong to
    # upstream, so this job can only ever fail here. It fires whenever a rebase
    # brings in an upstream change under scripts/.
    if: github.repository == 'apernet/hysteria'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish scripts to Cloudflare Pages
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: hy2scripts
          directory: scripts
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
